    <text x="330" y="38">A</text><text x="176" y="275">B</text><text x="451" y="275">C</text>
    <text x="328" y="365">T</text><text x="155" y="360">P<tspan baseline-shift="sub" font-size="15">B</tspan></text>
    <text x="452" y="360">P<tspan baseline-shift="sub" font-size="15">C</tspan></text><text x="328" y="276">Q</text>
    <text x="105" y="215" fill="#475569">Γ</text><text x="177" y="314" font-size="17">l<tspan baseline-shift="sub" font-size="12">B</tspan></text>
    <text x="447" y="314" font-size="17">l<tspan baseline-shift="sub" font-size="12">C</tspan></text>
  </g>
