<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">BMO2 2022 Question 4 configuration</title>
  <desc id="desc">Triangle ABC in its circumcircle, with T on the minor arc BC, tangent PB-T-PC, perpendicular lines through B and C, and Q on BC and AT.</desc>
  <rect width="640" height="420" fill="white"/>
  <g fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="320" cy="190" r="150"/>
    <path d="M320 40 L200 280 L440 280 Z"/>
    <path d="M200 280 V360 M440 280 V360" stroke="#64748b"/>
    <path d="M170 340 H470" stroke="#0f766e" stroke-width="3"/>
    <path d="M320 40 V340" stroke="#7c3aed" stroke-width="2.7"/>
    <path d="M200 340 L320 280 L440 340" stroke="#b45309" stroke-width="2.7"/>
  </g>
  <g fill="#0f172a">
    <circle cx="320" cy="40" r="4.5"/><circle cx="200" cy="280" r="4.5"/><circle cx="440" cy="280" r="4.5"/>
    <circle cx="320" cy="340" r="4.5"/><circle cx="200" cy="340" r="4.5"/><circle cx="440" cy="340" r="4.5"/><circle cx="320" cy="280" r="4.5"/>
  </g>
