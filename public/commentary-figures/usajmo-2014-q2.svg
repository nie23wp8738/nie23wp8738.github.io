<svg xmlns="http://www.w3.org/2000/svg" width="362" height="337" viewBox="48 2 362 337" role="img" aria-labelledby="title desc">
  <title id="title">Euler line in a triangle with a 60-degree angle</title>
  <desc id="desc">The line through the orthocenter H and circumcenter O cuts AB at P and AC at Q. The marked points on this line occur in the order P, H, O, Q.</desc>
  <rect x="48" y="2" width="362" height="337" fill="white"/>
  <path d="M200 37 L104.667 202.122 H295.333 Z" fill="#f1f4f5"/>
  <path d="M200 37 L79 246.578 L365 322.788 Z" fill="none" stroke="#263749" stroke-width="2.1" stroke-linejoin="round"/>
  <g fill="none" stroke="#526d80" stroke-width="1.8">
    <path d="M72 202.122 H104.667 M295.333 202.122 H328" stroke-dasharray="5 4"/>
    <path d="M104.667 202.122 H295.333"/>
    <path d="M222.5 75.971 A45 45 0 0 1 177.5 75.971" stroke-width="1.3"/>
  </g>
  <g fill="#172b3b">
    <circle cx="200" cy="37" r="2.8"/>
    <circle cx="79" cy="246.578" r="2.8"/>
    <circle cx="365" cy="322.788" r="2.8"/>
    <circle cx="104.667" cy="202.122" r="3"/>
    <circle cx="156" cy="202.122" r="3"/>
    <circle cx="244" cy="202.122" r="3"/>
    <circle cx="295.333" cy="202.122" r="3"/>
  </g>
  <g font-family="Georgia, 'DejaVu Serif', serif" fill="#172b3b" text-anchor="middle">
    <g font-size="19" font-style="italic">
      <text x="200" y="27">A</text>
      <text x="67" y="261">B</text>
      <text x="379" y="330">C</text>
      <text x="92" y="193">P</text>
      <text x="156" y="225">H</text>
      <text x="244" y="225">O</text>
      <text x="309" y="193">Q</text>
    </g>
    <text x="200" y="103" font-size="15">60°</text>
  </g>
</svg>
