<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 350" role="img" aria-labelledby="title desc">
  <title id="title">Four closed skating routes on congruent rinks</title>
  <desc id="desc">P follows the rink outline. Q crosses the middle twice in each of two half-height sections. R uses two chords at each end. S crosses the rectangular middle along both diagonals.</desc>
  <defs>
    <path id="rink" d="M 25 46 A 28 28 0 0 1 81 46 V 118 A 28 28 0 0 1 25 118 Z"/>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#a3aaae" stroke-width="1.4" stroke-dasharray="3 3">
      <use href="#rink"/>
      <use href="#rink" x="136"/>
      <use href="#rink" y="174"/>
      <use href="#rink" x="136" y="174"/>
    </g>
    <g stroke="#203847" stroke-width="3">
      <use href="#rink"/>
      <path transform="translate(136 0)" d="M 25 46 A 28 28 0 0 1 81 46 L 25 82 L 81 118 A 28 28 0 0 1 25 118 L 81 82 Z"/>
      <path transform="translate(0 174)" d="M 25 46 L 67 21.7513 L 81 46 V 118 L 39 142.2487 L 25 118 Z"/>
      <path transform="translate(136 174)" d="M 25 46 A 28 28 0 0 1 81 46 L 25 118 A 28 28 0 0 0 81 118 Z"/>
    </g>
  </g>
  <g font-family="Georgia, serif" font-size="14" font-style="italic" fill="#203847" text-anchor="middle">
    <text x="53" y="165">P</text>
    <text x="189" y="165">Q</text>
    <text x="53" y="339">R</text>
    <text x="189" y="339">S</text>
  </g>
</svg>
