<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">USAJMO 2015 Problem 5 configuration</title>
  <desc id="desc">A convex cyclic quadrilateral ABCD with diagonals AC and BD and points X and Y on the diagonals.</desc>
  <rect width="720" height="430" fill="#fff"/>
  <g fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="360" cy="214" r="175"/>
    <path d="M244 83 L508 106 L493 333 L193 283 Z"/>
    <line x1="244" y1="83" x2="493" y2="333" stroke="#2563eb"/>
    <line x1="508" y1="106" x2="193" y2="283" stroke="#b45309"/>
    <path d="M244 83 L365 225 L193 283 M493 333 L365 225 L508 106" stroke="#64748b" stroke-dasharray="6 5"/>
    <g fill="#111827" stroke="none">
      <circle cx="244" cy="83" r="4.8"/><circle cx="508" cy="106" r="4.8"/>
      <circle cx="493" cy="333" r="4.8"/><circle cx="193" cy="283" r="4.8"/>
      <circle cx="340" cy="200" r="4.8"/><circle cx="371" cy="211" r="4.8"/>
