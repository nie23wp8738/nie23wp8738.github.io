name: Publish teaching website
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Restore verified source books and question extracts
        uses: actions/cache@v4
        with:
          path: |
            public/step-solutions
            public/euclid-papers
            public/euclid-parts
            .astro/euclid-stamps
          key: reading-assets-${{ runner.os }}-${{ hashFiles('src/data/*published*.json', 'scripts/fetch-*.mjs') }}
      - name: Install the PDF crop tool
        run: command -v pdftocairo || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
